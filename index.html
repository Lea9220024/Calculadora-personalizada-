<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="C.R.E.A.M." />
    <link rel="manifest" href="/manifest.webmanifest?v=5" />
    <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
    <title>C.R.E.A.M. — Finanzas Personales</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js?v=5');
            await registration.update();
          } catch (error) {
            console.error(error);
          }
        });
      }
    </script>
  </body>
</html>
