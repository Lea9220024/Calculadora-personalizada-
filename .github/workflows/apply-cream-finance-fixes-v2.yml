name: Apply C.R.E.A.M. finance fixes v2
on:
  push:
    paths:
      - 'android-widget/BUILD_TRIGGER.txt'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'Pattern not found: {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))
          patch('src/lib/supabaseRead.ts', "import { AppSettings, Category, MonthlyBudget, NetWorthSnapshot, PatrimonyItem, Transaction } from '../types';", "import { AppSettings, Category, FinancialCard, InstallmentPlan, MonthlyBudget, NetWorthSnapshot, PatrimonyItem, Transaction } from '../types';")
          patch('src/lib/supabaseRead.ts', "  netWorthSnapshots: NetWorthSnapshot[];\n}", "  netWorthSnapshots: NetWorthSnapshot[];\n  cards: FinancialCard[];\n  installmentPlans: InstallmentPlan[];\n}")
          patch('src/lib/supabaseRead.ts', "  const [transactionsResult, categoriesResult, budgetsResult, settingsResult, patrimonyResult, snapshotsResult] = await Promise.all([", "  const [transactionsResult, categoriesResult, budgetsResult, settingsResult, patrimonyResult, snapshotsResult, cardsResult, installmentPlansResult] = await Promise.all([")
          patch('src/lib/supabaseRead.ts', "    supabase.from('calculator_net_worth_snapshots').select('*').eq('user_id', userId).order('snapshot_date', { ascending: false }),\n  ]);", "    supabase.from('calculator_net_worth_snapshots').select('*').eq('user_id', userId).order('snapshot_date', { ascending: false }),\n    supabase.from('calculator_cards').select('*').eq('user_id', userId).order('created_at', { ascending: false }),\n    supabase.from('calculator_installment_plans').select('*').eq('user_id', userId).order('created_at', { ascending: false }),\n  ]);")
          patch('src/lib/supabaseRead.ts', "  if (snapshotsResult.error) throw new Error(`Historial patrimonial: ${snapshotsResult.error.message}`);", "  if (snapshotsResult.error) throw new Error(`Historial patrimonial: ${snapshotsResult.error.message}`);\n  if (cardsResult.error) throw new Error(`Tarjetas: ${cardsResult.error.message}`);\n  if (installmentPlansResult.error) throw new Error(`Planes de cuotas: ${installmentPlansResult.error.message}`);")
          patch('src/lib/supabaseRead.ts', "    isRecurring: row.is_recurring ?? false,\n    createdAt: row.created_at,", "    isRecurring: row.is_recurring ?? false,\n    cardId: row.card_id ?? undefined,\n    installmentPlanId: row.installment_plan_id ?? undefined,\n    installmentNumber: row.installment_number ?? undefined,\n    installmentTotal: row.installment_total ?? undefined,\n    installmentTotalAmount: row.installment_total_amount == null ? undefined : Number(row.installment_total_amount),\n    createdAt: row.created_at,")
          patch('src/lib/supabaseRead.ts', "    netWorthSnapshots: (snapshotsResult.data ?? []).map((row) => ({ id: row.id, snapshotDate: row.snapshot_date, totalAssets: Number(row.total_assets), totalLiabilities: Number(row.total_liabilities), netWorth: Number(row.net_worth), createdAt: row.created_at })),\n  };", "    netWorthSnapshots: (snapshotsResult.data ?? []).map((row) => ({ id: row.id, snapshotDate: row.snapshot_date, totalAssets: Number(row.total_assets), totalLiabilities: Number(row.total_liabilities), netWorth: Number(row.net_worth), createdAt: row.created_at })),\n    cards: (cardsResult.data ?? []).map((row) => ({ id: row.id, name: row.name, type: row.type, brand: row.brand ?? undefined, last4: row.last4 ?? undefined, creditLimit: row.credit_limit == null ? undefined : Number(row.credit_limit), closingDay: row.closing_day ?? undefined, dueDay: row.due_day ?? undefined, active: row.active ?? true, createdAt: row.created_at })),\n    installmentPlans: (installmentPlansResult.data ?? []).map((row) => ({ id: row.id, cardId: row.card_id, title: row.title, totalAmount: Number(row.total_amount), installmentAmount: Number(row.installment_amount), installments: Number(row.installments), currentInstallment: Number(row.current_installment), startDate: row.start_date, transactionId: row.transaction_id ?? undefined, notes: row.notes ?? undefined, createdAt: row.created_at })),\n  };")
          patch('src/lib/supabaseWrite.ts', "is_recurring: transaction.isRecurring ?? false, created_at: transaction.createdAt", "is_recurring: transaction.isRecurring ?? false, card_id: transaction.cardId ?? null, installment_plan_id: transaction.installmentPlanId ?? null, installment_number: transaction.installmentNumber ?? null, installment_total: transaction.installmentTotal ?? null, installment_total_amount: transaction.installmentTotalAmount ?? null, created_at: transaction.createdAt")
          patch('src/lib/supabaseRealtime.ts', "  'calculator_settings',\n] as const;", "  'calculator_settings',\n  'calculator_cards',\n  'calculator_installment_plans',\n] as const;")
          patch('src/App.tsx', "import { deleteCategoryFromSupabase, deletePatrimonyItemFromSupabase, deleteTransactionFromSupabase, syncBudgetToSupabase, syncCategoryToSupabase, syncNetWorthSnapshotToSupabase, syncPatrimonyItemToSupabase, syncSettingsToSupabase, syncTransactionToSupabase } from './lib/supabaseWrite';", "import { deleteCategoryFromSupabase, deletePatrimonyItemFromSupabase, deleteTransactionFromSupabase, syncBudgetToSupabase, syncCategoryToSupabase, syncNetWorthSnapshotToSupabase, syncPatrimonyItemToSupabase, syncSettingsToSupabase, syncTransactionToSupabase } from './lib/supabaseWrite';\nimport { deleteCardFromSupabase, syncCardToSupabase, syncInstallmentPlanToSupabase } from './lib/supabaseCards';")
          patch('src/App.tsx', "setPatrimonyItems(cloudData.patrimonyItems);setNetWorthSnapshots(cloudData.netWorthSnapshots)}", "setPatrimonyItems(cloudData.patrimonyItems);setNetWorthSnapshots(cloudData.netWorthSnapshots);setCards(cloudData.cards);setInstallmentPlans(cloudData.installmentPlans)}")
          patch('src/App.tsx', "const handleAddCard=(newCard:Omit<FinancialCard,'id'|'createdAt'>)=>{const card={...newCard,id:createId('card'),createdAt:new Date().toISOString()};setCards(prev=>[card,...prev])};const handleUpdateCard=(updated:FinancialCard)=>setCards(prev=>prev.map(c=>c.id===updated.id?updated:c));const handleDeleteCard=(id:string)=>setCards(prev=>prev.filter(c=>c.id!==id));", "const handleAddCard=(newCard:Omit<FinancialCard,'id'|'createdAt'>)=>{const card={...newCard,id:createId('card'),createdAt:new Date().toISOString()};setCards(prev=>[card,...prev]);syncInBackground(()=>syncCardToSupabase(card),'la tarjeta')};const handleUpdateCard=(updated:FinancialCard)=>{setCards(prev=>prev.map(c=>c.id===updated.id?updated:c));syncInBackground(()=>syncCardToSupabase(updated),'la tarjeta')};const handleDeleteCard=(id:string)=>{setCards(prev=>prev.filter(c=>c.id!==id));syncInBackground(()=>deleteCardFromSupabase(id),'la eliminación de la tarjeta')};")
          patch('src/App.tsx', "setInstallmentPlans(prev=>[plan,...prev])}}};", "setInstallmentPlans(prev=>[plan,...prev]);syncInBackground(()=>syncInstallmentPlanToSupabase(plan),'el plan de cuotas')}}};")
          dash=Path('src/components/SovereignDashboard.tsx'); s=dash.read_text()
          patch('src/components/SovereignDashboard.tsx', "  const [trendView, setTrendView] = useState<'total' | 'liquid' | 'invested'>('total');", "  const [trendView, setTrendView] = useState<'total' | 'liquid' | 'invested'>('total');\n  const [selectedIncome, setSelectedIncome] = useState<Transaction | null>(null);")
          patch('src/components/SovereignDashboard.tsx', "onClick={() => onNavigateTab('transactions')}\n            className=\"bg-[#171B26] border border-zinc-800 hover:border-zinc-700/80 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer transition-all\"", "onClick={() => setSelectedIncome(incomeTransactions[0] ?? null)}\n            className=\"bg-[#171B26] border border-zinc-800 hover:border-zinc-700/80 rounded-2xl p-4 flex items-center justify-between shadow-sm cursor-pointer transition-all\"")
          marker="      {/* Header Banner - Executive Console */}"
          modal='''      {selectedIncome && (\n        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedIncome(null)}>\n          <div className="w-full max-w-lg rounded-2xl border border-zinc-800 bg-[#171B26] shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>\n            <div className="flex items-center justify-between px-5 py-4 border-b border-zinc-800"><div><p className="text-[10px] font-bold uppercase tracking-[0.18em] text-emerald-400">Detalle del ingreso</p><h3 className="text-lg font-extrabold text-white mt-1">{formatMonthYear(currentMonthKey)}</h3></div><button onClick={() => setSelectedIncome(null)} className="px-3 py-1.5 rounded-lg bg-zinc-800 text-zinc-300 text-xs font-bold">Cerrar</button></div>\n            <div className="p-5 space-y-3">\n              {incomeTransactions.map(tx => { const category=categories.find(c=>c.id===tx.categoryId); return <div key={tx.id} className="rounded-xl border border-zinc-800 bg-[#1C1F2A] p-4"><div className="flex items-start justify-between gap-3"><div><p className="font-extrabold text-white">{tx.title}</p><p className="text-xs text-[#9AA6A0] mt-1">{formatDateSpanish(tx.date)} · {category?.name ?? 'Sin categoría'}</p></div><p className="font-extrabold text-emerald-400 font-mono">{val(tx.amount)}</p></div>{tx.notes && <p className="text-xs text-zinc-400 mt-2">{tx.notes}</p>}</div>; })}\n              <div className="flex justify-between items-center pt-2 border-t border-zinc-800"><span className="text-xs font-bold text-[#9AA6A0]">Total de ingresos</span><span className="font-extrabold text-white font-mono">{val(totalIncome)}</span></div>\n            </div>\n          </div>\n        </div>\n      )}\n\n'''
          if marker not in s: raise SystemExit('Dashboard marker not found')
          dash.write_text(s.replace(marker,modal+marker,1))
          PY
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git diff --cached --quiet && exit 0
          git commit -m "Fix income detail card sync and credit installments"
          git push
